<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatch Desk · Service delivery</title><link rel="stylesheet" href="/desk.css"><script defer src="/app.js"></script></head><body><header><div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>Dispatch<span class="light">Desk</span></div><div class="local"><b></b> Local workspace</div></header><main><div class="mast"><div><p class="kicker">Service delivery</p><h1>Operations desk</h1></div><button class="primary" id="new">+ New update</button></div><nav aria-label="Workspace" id="nav"></nav><div id="workspace" aria-live="polite">Opening desk…</div></main><dialog id="compose"><form id="form"><div class="spread"><h2>New update</h2><button type="button" id="close" aria-label="Close">×</button></div><label>Start from a sample<select id="sample"></select></label><label>Subject<input id="subject" maxlength="200" required></label><label>Received on<input type="date" id="day" required></label><label>Carrier message<textarea id="body" rows="5" maxlength="16000" required></textarea></label><p id="mode"></p><p id="err" role="alert"></p><button class="primary" id="analyze">Analyze update →</button></form></dialog><div id="notice" role="status"></div></body></html>
